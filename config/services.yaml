# WebUI Hub 服务声明配置
# ------------------------------------------------------------------
# 所有对接的 AI 服务在此声明，壳启动时动态加载服务列表。
# 第一步后端仅实现 "deepseek_harness"（WSL 内运行）。
#
# 字段说明（见 README copy.md 核心功能 1）：
#   label        显示名
#   mode         webview_embed | api_proxy
#                webview_embed: WebView 直接加载服务自带 Web UI
#                api_proxy:     壳内 Rust 反向代理 API，前端自绘界面
#   base_url     Windows 侧访问地址（WSL2 端口转发到 localhost）
#   ui_path      界面路径
#   health       健康检查端点
#   install      安装方式
#     type       wsl_script | wsl_native
#     script_url 远程引导脚本（wsl_script）
#     package    包名（wsl_native）
#   autostart    启动命令
#   depends_on   依赖（如 wsl）
#
# 坑点规避（README 已知限制）：
#   - 用 127.0.0.1 而非 localhost（规避部分 VPN 劫持 localhost 的解析）
#   - dsh 不锁版本，bootstrap 脚本始终安装最新版
#   - WSL 端口转发在休眠/唤醒后可能断连，health.rs 会做重试并提示 wsl --shutdown

services:
  deepseek_harness:
    label: "DeepSeek Harness"
    mode: webview_embed
    base_url: "http://127.0.0.1:3080"
    ui_path: "/"
    health: "http://127.0.0.1:3080/"
    install:
      type: wsl_script
      script_url: "scripts/bootstrap-dsh.sh"
    autostart:
      # --no-open 禁止 dsh 自动打开浏览器（壳内用 WebView 嵌入，不需要弹浏览器）
      cmd: "dsh web --port 3080 --no-open"
    depends_on: ["wsl"]

  open_webui:
    label: "Open WebUI"
    mode: webview_embed
    base_url: "http://127.0.0.1:8080"
    ui_path: "/"
    health: "http://127.0.0.1:8080/health"
    install:
      type: wsl_script
      script_url: "scripts/bootstrap-openwebui.sh"
    autostart:
      # bootstrap 脚本内用 venv 隔离安装；启动需指向 venv 内的可执行。
      # OWUI 默认监听 127.0.0.1:8080；--host 0.0.0.0 便于 WSL 端口转发到 Windows。
      cmd: "bash -lc '$HOME/.venv/open-webui/bin/open-webui serve --host 0.0.0.0 --port 8080'"
    depends_on: ["wsl"]

  hermes_agent:
    label: "Hermes Agent"
    mode: webview_embed
    base_url: "http://127.0.0.1:9119"
    ui_path: "/"
    health: "http://127.0.0.1:9119/"
    install:
      type: wsl_script
      script_url: "scripts/bootstrap-hermes.sh"
    autostart:
      # hermes dashboard 默认绑定 127.0.0.1:9119。
      # 必须绑定回环地址而非 0.0.0.0：v0.21 起非回环绑定会强制启用鉴权网关，
      # 未配置用户名/密码或 OAuth 时服务 fail-closed 拒绝启动（健康检查即失败）。
      # Windows 侧通过 WSL 的 localhost 端口转发访问 127.0.0.1:9119（与其他服务一致）。
      # --no-open 禁止自动打开浏览器（WSL 无图形界面，避免报错/挂起）。
      cmd: "hermes dashboard --host 127.0.0.1 --port 9119 --no-open"
    depends_on: ["wsl"]

